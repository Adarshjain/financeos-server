name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pick this shard's test classes
        run: |
          if [ "${{ matrix.shard }}" = "1" ]; then python3 .github/scripts/test-shard.py --check 4; fi
          python3 .github/scripts/test-shard.py ${{ matrix.shard }} 4 "$RUNNER_TEMP/shard.txt"

      - name: Test
        run: ./mvnw -B test "-Dsurefire.includesFile=$RUNNER_TEMP/shard.txt"

      # Job logs need a login but annotations are public, so failing tests are named here.
      - name: Name failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/*-reports/TEST-*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = tc.find(kind)
                      if e is not None:
                          msg = (e.get('message') or kind).replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:300]
                          print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY

      # OpenApiExportTest regenerates api-spec.yaml in whichever shard runs it; the other shards leave the file
      # untouched and pass trivially, so a stale committed spec fails exactly that shard.
      - name: Spec drift
        run: git diff --exit-code -- api-spec.yaml

  refs:
    runs-on: ubuntu-latest
    outputs:
      client_ref: ${{ steps.extract.outputs.client_ref }}
    steps:
      - id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ref=$(echo "$PR_BODY" | grep -oE '^e2e-client-ref:[[:space:]]*[A-Za-z0-9._/-]+' | head -1 | sed -E 's/^e2e-client-ref:[[:space:]]*//' || true)
          echo "client_ref=${ref:-main}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [refs]
    uses: Adarshjain/financeos-client/.github/workflows/e2e.yml@main
    with:
      server_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      client_ref: ${{ needs.refs.outputs.client_ref }}
