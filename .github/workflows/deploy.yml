name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, and a running deploy is never cancelled (a cancel mid-swap could leave a VM on a half-done
# deploy with no rollback). A newer push waits; of several waiting pushes only the latest one runs.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Matches the existing manual layout on the VM — do not change without updating financeos.service.
  APP_DIR: /home/ubuntu/financeos-server
  APP_PORT: "8080"
  MGMT_PORT: "8081"
  # How long the deploy waits for running background jobs before giving up (and NOT restarting).
  DRAIN_TIMEOUT_SECONDS: "2400"
  # Empty when the secret is unset; slack-notify.sh then warns and exits 0.
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  DEPLOY_COMPONENT: Server

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      start_ts: ${{ steps.notify-start.outputs.start_ts }}
    steps:
      - uses: actions/checkout@v4

      - name: Notify Slack — started
        id: notify-start
        continue-on-error: true
        run: |
          start_ts=$(date +%s)
          echo "start_ts=$start_ts" >> "$GITHUB_OUTPUT"
          DEPLOY_START_TS="$start_ts" .github/scripts/slack-notify.sh started

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: ./mvnw -B -DskipTests package "-DgitSha=${GITHUB_SHA::12}"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/backend-1.0.0.jar
          retention-days: 1

  test:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pick this shard's test classes
        run: |
          if [ "${{ matrix.shard }}" = "1" ]; then python3 .github/scripts/test-shard.py --check 4; fi
          python3 .github/scripts/test-shard.py ${{ matrix.shard }} 4 "$RUNNER_TEMP/shard.txt"

      - name: Test
        run: ./mvnw -B test "-Dsurefire.includesFile=$RUNNER_TEMP/shard.txt"

      # Job logs need a login but annotations are public, so failing tests are named here.
      - name: Name failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('target/*-reports/TEST-*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = tc.find(kind)
                      if e is not None:
                          msg = (e.get('message') or kind).replace('%', '%25').replace('\r', ' ').replace('\n', ' ')[:300]
                          print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg}")
          PY

      # OpenApiExportTest regenerates api-spec.yaml in whichever shard runs it; the other shards leave the file
      # untouched and pass trivially, so a stale committed spec fails exactly that shard.
      - name: Spec drift
        run: git diff --exit-code -- api-spec.yaml

  # Runs alongside build (it builds its own jar from this commit); deploy still needs all to pass.
  e2e:
    uses: Adarshjain/financeos-client/.github/workflows/e2e.yml@main
    with:
      server_ref: ${{ github.sha }}
      client_ref: main

  deploy:
    needs: [build, test, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream build, test and E2E status
        run: |
          if [ "${{ needs.build.result }}" = "cancelled" ] || [ "${{ needs.test.result }}" = "cancelled" ] || [ "${{ needs.e2e.result }}" = "cancelled" ]; then
            echo "Upstream job was cancelled. Skipping deployment."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Upstream job failed: build=${{ needs.build.result }}, test=${{ needs.test.result }}, e2e=${{ needs.e2e.result }}. Skipping deployment."
            exit 1
          fi

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: target

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Worker VM first, then the API VM. Each host rolls itself back to its previous JAR when the new one is not
      # healthy, so a failed deploy leaves it serving the old build. A worker failure stops the run before the API
      # is touched; an API that does not end on the new JAR gets the worker rolled back too, so both VMs always
      # end on one build. deploy-host.sh writes result/version outputs for the Slack summary.
      # WORKER_HOST unset = single-VM deploy exactly as before.
      - name: Check for worker host
        id: worker
        env:
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
        run: |
          if [ -n "$WORKER_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "WORKER_HOST not set; deploying the API VM only."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker VM
        id: deploy-worker
        if: steps.worker.outputs.enabled == 'true'
        env:
          HOST: ${{ secrets.WORKER_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: bash deploy/deploy-host.sh "$HOST" "$USER" worker

      - name: Deploy API VM
        id: deploy-api
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: bash deploy/deploy-host.sh "$HOST" "$USER" api

      - name: Roll back worker VM (API did not take the new JAR)
        id: rollback-worker
        if: (failure() || cancelled()) && steps.deploy-worker.outputs.result == 'deployed' && steps.deploy-api.outputs.result != 'deployed'
        env:
          HOST: ${{ secrets.WORKER_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DRAIN_TIMEOUT_SECONDS: "600"
        run: bash deploy/deploy-host.sh "$HOST" "$USER" worker rollback
      # A failure or cancel after a drain started (e.g. the JAR swap) would leave that old server paused.
      # After a restart this is a no-op: a fresh JVM starts unpaused.
      - name: Resume job workers on failure
        if: failure() || cancelled()
        env:
          API_HOST: ${{ secrets.DEPLOY_HOST }}
          WORKER_HOST: ${{ secrets.WORKER_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          bash deploy/resume-jobs.sh "$API_HOST" "$USER"
          if [ -n "$WORKER_HOST" ]; then bash deploy/resume-jobs.sh "$WORKER_HOST" "$USER"; fi

      - name: Notify Slack — result
        if: always()
        continue-on-error: true
        env:
          DEPLOY_START_TS: ${{ needs.build.outputs.start_ts }}
          WORKER_ENABLED: ${{ steps.worker.outputs.enabled }}
          WORKER_RESULT: ${{ steps.deploy-worker.outputs.result }}
          WORKER_VERSION: ${{ steps.deploy-worker.outputs.version }}
          WORKER_RB_RESULT: ${{ steps.rollback-worker.outputs.result }}
          WORKER_RB_VERSION: ${{ steps.rollback-worker.outputs.version }}
          WORKER_OUTCOME: ${{ steps.deploy-worker.outcome }}
          API_OUTCOME: ${{ steps.deploy-api.outcome }}
          API_RESULT: ${{ steps.deploy-api.outputs.result }}
          API_VERSION: ${{ steps.deploy-api.outputs.version }}
        run: |
          # One line per VM: what happened and the build it serves now; then whether both VMs agree.
          line() {   # $1 label, $2 result, $3 version, $4 step outcome
            if [ -z "$2" ] && { [ "$4" = "failure" ] || [ "$4" = "cancelled" ]; }; then
              echo "$1 :warning: state unknown (step stopped mid-deploy): check this VM"; return
            fi
            case "$2" in
              deployed)    echo "$1 :white_check_mark: \`$3\`" ;;
              rolled_back) echo "$1 :leftwards_arrow_with_hook: rolled back, serving \`$3\`" ;;
              aborted)     echo "$1 :pause_button: not changed, serving \`$3\`" ;;
              down)        echo "$1 :rotating_light: DOWN on both JARs — manual fix needed (deploy/README.md)" ;;
              *)           echo "$1 – not changed" ;;
            esac
          }
          w_result="$WORKER_RESULT"; w_version="$WORKER_VERSION"
          if [ -n "$WORKER_RB_RESULT" ]; then w_result="$WORKER_RB_RESULT"; w_version="$WORKER_RB_VERSION"; fi
          detail=""
          if [ "$WORKER_ENABLED" = "true" ]; then detail="$(line Worker "$w_result" "$w_version" "$WORKER_OUTCOME")"$'\n'; fi
          detail="$detail$(line API "$API_RESULT" "$API_VERSION" "$API_OUTCOME")"
          if [ "$WORKER_ENABLED" = "true" ] && [ -n "$w_version" ] && [ -n "$API_VERSION" ] && [ "$API_VERSION" != unknown ] && [ "$w_version" != unknown ]; then
            if [ "$w_version" = "$API_VERSION" ]; then
              detail="$detail"$'\n'"Both VMs on \`$API_VERSION\`."
            else
              detail="$detail"$'\n'":warning: VMs differ: worker \`$w_version\`, API \`$API_VERSION\`."
            fi
          elif [ "$WORKER_ENABLED" = "true" ] && { [ "$w_version" = unknown ] || [ "$API_VERSION" = unknown ]; }; then
            detail="$detail"$'\n'":grey_question: Could not read both VMs' versions to compare them."
          fi
          export DEPLOY_DETAIL="$detail"
          status="${{ job.status }}"
          if [ "${{ needs.build.result }}" = "cancelled" ] || [ "${{ needs.test.result }}" = "cancelled" ] || [ "${{ needs.e2e.result }}" = "cancelled" ]; then
            status="cancelled"
          fi
          .github/scripts/slack-notify.sh "$status"
