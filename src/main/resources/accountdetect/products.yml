# Card product catalogue for the account detector, per issuer id (ids as in BankDirectory). Current and legacy
# (discontinued, renamed, migrated) products, including co-brands.
#
# Key = the canonical name: the short marketed name with no issuer words, no "Bank" and no "Credit Card"
# ("Swiggy HDFC Bank Credit Card" -> Swiggy, "Amazon Pay ICICI Bank" -> Amazon Pay, "IDFC FIRST Wealth" -> First Wealth, "Kotak 811" -> 811).
# Value = aliases: other spellings seen in mail and statements. Issuer words, "bank", "credit" and "card" are
# stripped before matching, case and punctuation are ignored, and a trailing network word (Visa, Mastercard, RuPay,
# Amex, Diners) or "Metal"/"Edition" is tried off, so none of those need listing.
# A name made only of generic tier words (Platinum, Gold, Select, ...) is matched only right after the issuer's
# name and is never reported above LOW: on its own it does not identify a product.
# A phrase that is not in this catalogue is kept as printed and capped at LOW.
# Long form: Name: {aliases: [..], renamedFrom: [old names], renamedTo: Current, tierProduct: true}. Old and new
# names of a renamed product are one product, reported by its current name. tierProduct marks a tier-word name that
# this issuer sells as a product (Amex Gold); it counts only from a "<Issuer> <Name> Card" phrase or a statement.

