# Statement PDF password rules by bank key (BankDirectory) and kind (account | credit_card). Researched 2026-11-03.
# Quote bank ids that YAML reads as booleans (yes, no, on, off): bank: "yes".
# Tokens joined by +: NAME<n>U / NAME<n>L (first n letters of the first name, upper/lower), DDMM, DDMMYY, DDMMYYYY (birth date), CARD4 (card last 4), CARD6 (card last 6, kept on the account; the unlocker skips it).
# Patterns with any other token (CUSTID, CRN, PAN5, MOBILE4, ACCNO, CARD8, LIT(..)) are kept for reference; the unlocker skips them.
# Patterns are tried in order. confidence: official | secondary | unknown (how well the rule is documented).
entries:
  - {bank: hdfc, kind: account, confidence: official, patterns: ["CUSTID"]}
  - {bank: hdfc, kind: credit_card, confidence: secondary, patterns: ["NAME4U+CARD4", "NAME4L+DDMM", "CARD4+DDMM"]}
  - {bank: icici, kind: account, confidence: official, patterns: ["NAME4L+DDMM", "ACCNO"]}
  - {bank: icici, kind: credit_card, confidence: official, patterns: ["NAME4L+DDMM", "CARD4"]}
  - {bank: axis, kind: credit_card, confidence: official, patterns: ["NAME4U+DDMM", "NAME4U+CUSTID"]}
  - {bank: axis, kind: account, confidence: secondary, patterns: ["NAME4U+DDMM", "NAME4U+CUSTID", "MOBILE4+DDMMYYYY"]}
  - {bank: citi, kind: credit_card, confidence: unknown, patterns: ["NAME4U+DDMM", "NAME4U+CUSTID"]}
  - {bank: sbi, kind: credit_card, confidence: secondary, patterns: ["NAME4U+DDMM", "DDMMYYYY+CARD4"]}
  - {bank: kotak, kind: credit_card, confidence: secondary, patterns: ["NAME4L+DDMM", "CRN+DDMM"]}
  - {bank: kotak, kind: account, confidence: secondary, patterns: ["CRN", "DDMMYYYY"]}
  - {bank: indusind, kind: account, confidence: official, patterns: ["NAME4U+DDMM", "CUSTID"]}
  - {bank: indusind, kind: credit_card, confidence: secondary, patterns: ["NAME4U+DDMM"]}
  - {bank: "yes", kind: account, confidence: secondary, patterns: ["CUSTID+DDMMYYYY", "PAN5+DDMMYYYY"]}
  - {bank: "yes", kind: credit_card, confidence: secondary, patterns: ["CUSTID+DDMMYYYY"]}
  - {bank: idfc_first, kind: account, confidence: secondary, patterns: ["DDMMYYYY", "ACCNO+DDMMYYYY"]}
  - {bank: federal, kind: account, confidence: official, patterns: ["NAME4U+DDMM"]}
  - {bank: au, kind: account, confidence: secondary, patterns: ["CUSTID+DDMMYYYY"]}
  - {bank: rbl, kind: credit_card, confidence: secondary, patterns: ["NAME4U+DDMMYY", "NAME4U+DDMM"]}
  - {bank: sc, kind: credit_card, confidence: secondary, patterns: ["CARD8+DDMMYYYY"]}
  - {bank: bank_of_baroda, kind: account, confidence: secondary, patterns: ["NAME4L+DDMM", "ACCNO+DDMMYYYY"]}
  - {bank: canara, kind: account, confidence: secondary, patterns: ["DDMMYYYY", "ACCNO+DDMMYYYY"]}
  - {bank: pnb, kind: account, confidence: secondary, patterns: ["DDMMYYYY", "ACCNO"]}
  - {bank: union_bank, kind: account, confidence: secondary, patterns: ["NAME4U+DDMM"]}
  - {bank: boi, kind: account, confidence: secondary, patterns: ["NAME4U+DDMM"]}
  - {bank: indian_bank, kind: account, confidence: secondary, patterns: ["ACCNO"]}
  - {bank: central, kind: account, confidence: secondary, patterns: ["CUSTID+LIT(@)+DDMMYYYY"]}
  - {bank: idbi, kind: account, confidence: secondary, patterns: ["CUSTID"]}
  - {bank: kvb, kind: account, confidence: secondary, patterns: ["CUSTID+DDMMYYYY", "DDMMYYYY"]}
  - {bank: equitas, kind: account, confidence: secondary, patterns: ["DDMM+NAME3U", "DDMM+NAME3L", "NAME4U+DDMMYYYY"]}
  - {bank: ujjivan, kind: account, confidence: official, patterns: ["NAME4U+DDMMYY", "LIT(first initial)+LIT(space)+SURNAME2+DDMMYY", "CUSTID"]}
  - {bank: hdfc, kind: credit_card, confidence: secondary, patterns: ["NAME4U+CARD4", "NAME4L+DDMM"]}
  - {bank: hsbc, kind: credit_card, confidence: official, patterns: ["DDMMYY+CARD6"]}
