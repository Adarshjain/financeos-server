# Local, dev-only deterministic account detector (see AccountDetectV3Runner). No web server, no schedulers, no Flyway.
spring.main.web-application-type=none

# "-" disables a Spring cron trigger.
gmail.ingest.enabled=false
gmail.ingest.cron=-
notifications.enabled=false
notifications.tick-cron=-
notifications.feed.purge-cron=-
jobs.retention.cron=-
autolink.enabled=false
autolink.backfill.enabled=false
price.enabled=false
warm-ping.enabled=false
jobs.worker.enabled=false
jobs.janitor.startup-sweep.enabled=false
spring.flyway.enabled=false
# Machine-specific values come from the environment (never committed here):
#   ACCOUNT_DETECT_CONNECTION_ID   Gmail connection UUID to read
#   ACCOUNT_DETECT_OUT_DIR         where the report and derived-feature cache go
#   ACCOUNT_DETECT_STATEMENTS_DIR  optional folder of unlocked statement PDFs (recursive, any file name);
#                                  default <out dir>/statements
# Run from financeos-server:
#   set -a; . ./.env; set +a; export JAVA_HOME=/opt/homebrew/opt/openjdk@21
#   ACCOUNT_DETECT_CONNECTION_ID=<uuid> ACCOUNT_DETECT_OUT_DIR=<dir> ACCOUNT_DETECT_STATEMENTS_DIR=<dir> \
#     ./mvnw -o -q spring-boot:run -Dspring-boot.run.profiles=account-detect-v3 [-Dspring-boot.run.arguments=--from-cache]
financeos.account-detect-v3.batch-size=20
financeos.account-detect-v3.gets-per-second=45
financeos.account-detect-v3.alert-sample=12
