# Axis Bank credit card alerts. One template per real layout, newest first.
bank: axis
templates:
  # "Here's the summary of your Axis Bank Credit Card Transaction: Transaction Amount: INR 1,234 Merchant Name: SHOP ..."
  - id: axis.cc.spend.v2
    senders: &senders [axisbank.com, axis.bank.in]
    subject: 'spent on credit card'
    body: 'Transaction Amount:\s*(?<currency>[A-Z]{3})\s*(?<amount>[\d,]+(?:\.\d+)?)\s*Merchant Name:\s*(?<counterparty>.+?)\s*Axis Bank Credit Card No\.?\s*(?<last4>[X*]*\d+)\s*Date\s*&\s*Time:\s*(?<date>\d\d-\d\d-\d{4})'
    direction: DEBIT
    dateFormats: [dd-MM-yyyy]

  # "Thank you for using your credit card no. XX1234 for INR 1,234 at SHOP on 31-08-2025 08:27:43 IST." (older: "your Card no.", 2-digit year)
  - id: axis.cc.spend.v1
    senders: *senders
    subject: 'Transaction alert'
    body: 'Thank you for using your (?:Axis Bank )?(?:credit )?card no\.?\s*(?<last4>[X*]*\d+) for (?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?) at (?<counterparty>.+?) on (?<date>\d\d-\d\d-\d{2,4})'
    direction: DEBIT
    dateFormats: [dd-MM-yyyy, dd-MM-yy]

  # "Thank you for using your Card no. XX1234 to withdraw INR 101.99 on 23-02-26 12:51:40 IST at SHOP. Your available cash withdrawal limit is INR 75600."
  - id: axis.cc.cashwithdrawal.v1
    senders: *senders
    subject: 'Transaction alert'
    body: 'Thank you for using your (?:Axis Bank )?(?:credit )?card no\.?\s*(?<last4>[X*]*\d+) to withdraw (?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?) on (?<date>\d\d-\d\d-\d{2,4})[\d: ]*(?:IST)?\s*at (?<counterparty>.+?)\.(?:\s|$)'
    direction: DEBIT
    dateFormats: [dd-MM-yy, dd-MM-yyyy]

  # "the transaction of IDR 65000 on Axis Bank Credit Card no. XX1234 on 30-04-25 06:00:51 IST at SHOP has been reversed."
  - id: axis.cc.reversal.v1
    senders: *senders
    subject: 'Transaction alert'
    body: 'transaction of (?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?) on (?:your |Axis Bank )?(?:Axis Bank )?Credit Card no\.?\s*(?<last4>[X*]*\d+) on (?<date>\d\d-\d\d-\d{2,4})[\d: ]*(?:IST)?\s*at (?<counterparty>.+?) has been reversed'
    direction: CREDIT
    dateFormats: [dd-MM-yyyy, dd-MM-yy]

  # "Auto Pay facility has been successfully activated on your Axis Bank Card no. XX1234 for INR 130.00 from SHOP and initial amt of INR 35.00 has been debited."
  # The 130.00 is the mandate limit; the initial amount is the only money that moved. No initial debit = no template match.
  - id: axis.cc.autopay-initial.v1
    senders: *senders
    subject: 'Auto Pay facility'
    body: '(?<date>\d\d-\d\d-\d{4})[^a-zA-Z]{0,20}Dear Customer,(?s:.{0,200}?)activated on your (?:Axis Bank )?(?:credit )?card no\.?\s*(?<last4>[X*]*\d+) for [A-Z]{3} [\d,]+(?:\.\d+)? from (?<counterparty>.+?) and initial amt of (?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?) has been debited'
    direction: DEBIT
    dateFormats: [dd-MM-yyyy]
