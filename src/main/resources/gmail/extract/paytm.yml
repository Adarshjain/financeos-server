# Paytm (paytm.com): credit card bill payment from the Paytm wallet (read as a payment received on the paid card); loan / bill payments from UPI (read as a debit).
bank: paytm
templates:
  # "Credit card Payment Successful INR 2345 For Axis Bank Credit Card Number XXXX XXXX XXXX 1234 Paid From <wallet> 11:03 PM, Jan 31, 2024"
  - id: paytm.card.bill.v1
    senders: [paytm.com]
    body: 'Credit card Payment Successful\s+(?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?)\s+For\s+.{1,40}?Credit Card Number\s+[X\s]*(?<last4>\d{4})\s+Paid From(?s:.*?)\d{1,2}:\d\d [AP]M, (?<date>[A-Za-z]{3} \d{1,2}, \d{4})'
    direction: CREDIT
    dateFormats: ['MMM d, yyyy']

  # "Loan Payment Successful INR 3012 For Sample Bank Ltd Loan Account Number 100000000 Paid From Your UPI account 07:56 PM, Jan 30, 2024 Order ID 123" (any "<X> Payment Successful ... For <payee> <...> Number <n> Paid From" bill layout; after the card bill)
  - id: paytm.bill.payment.v1
    senders: [paytm.com]
    body: 'Payment Successful\s+(?<currency>[A-Z]{3}) (?<amount>[\d,]+(?:\.\d+)?)\s+For\s+(?<counterparty>.+?)\s+(?:Account\s+)?Number\s+[\dX\s]+?Paid From(?s:.*?)\d{1,2}:\d\d [AP]M, (?<date>[A-Za-z]{3} \d{1,2}, \d{4})'
    direction: DEBIT
    dateFormats: ['MMM d, yyyy']
    counterpartyStrip: ['\s+(?:Loan|Policy|Consumer|Customer|Connection|Subscriber|Mobile)$']
