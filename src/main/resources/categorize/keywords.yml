# Phrases that decide a category on their own (step KEYWORD), checked top to bottom, first rule wins.
# A rule matches when every condition it names matches; a condition is a list of regexes, any one hits.
# Conditions: subject, text (first 1500 chars), counterparty, from (sender address), any (subject + counterparty + text).
# A rule may also set direction. Words that only describe a kind of shop are matched on the counterparty alone.
rules:
  - id: reversal
    category: refund
    direction: CREDIT
    subject: ['\brefund(?:ed|s)?\b', '\btransaction reversal\b', '\breversal (?:of|initiated|processed|credit|upi)\b', '\bchargeback\b', '\bcredited back\b', '\btransaction (?:has been )?reversed\b']
  - id: reversal-counterparty
    category: refund
    direction: CREDIT
    counterparty: ['\brefund(?:ed|s)?\b', '\breversal\b']
  - id: reversal-credited
    category: refund
    direction: CREDIT
    text: ['\brefund(?:ed)?\b(?! polic).{0,60}\b(?:credited|processed|initiated)\b', '\breversal (?:of|initiated|processed|credit|upi)\b', '\bmandate refu', '\bcredited back\b', '\btransaction (?:has been )?reversed\b', '\bchargeback\b']
  - id: mobile-plan
    category: bills.mobile
    counterparty: ['\b(?:prepaid|postpaid)\b']
  - id: google-play
    category: subscriptions.software
    counterparty: ['\bgoogle play\b']
  - id: cashback
    category: cashback
    direction: CREDIT
    subject: ['cash ?back\b', '\breward points? (?:credited|redeemed|encashed)\b', '\begift card credited\b']
  - id: cashback-counterparty
    category: cashback
    direction: CREDIT
    counterparty: ['cash ?back\b']
  - id: cashback-credited
    category: cashback
    direction: CREDIT
    text: ['cash ?back (?:of )?(?:rs\.?|inr|₹)? ?[\d,.]+ (?:has been |was |is )?(?:successfully )?(?:credited|received)\b', '\bcredited\b(?:(?!\bearn\b).){0,60}cash ?back', '\breward points?\b.{0,80}\badded\b']
  - id: salary
    category: salary.salary
    direction: CREDIT
    subject: ['\bsalary\b']
  - id: salary-any
    category: salary.salary
    direction: CREDIT
    any: ['\bsalary (?:credit|for|of|from)\b', '\bsal(?:ary)? cr\b', '\bpayroll\b']
  - id: salary-counterparty
    category: salary.salary
    direction: CREDIT
    counterparty: ['\bsalary\b', '\bpayroll\b']
  - id: bonus
    category: salary.bonus
    direction: CREDIT
    counterparty: ['\bbonus\b', '\bincentive\b']
  - id: interest
    category: interest
    direction: CREDIT
    any: ['\binterest (?:credited|credit|paid|payout|capitalised|capitalized)\b', '\bint\.? ?pd\b', '\bcredit interest\b', '\bsavings (?:a/c |account )?interest\b', '\bfd interest\b', '\bquarterly interest\b', '\bint(?:erest)? (?:on|for) (?:fd|fixed deposit|savings|sb)\b']
  - id: dividend
    category: dividends
    direction: CREDIT
    any: ['\bdividend\b', '\bach c[- ]?(?:kfin|cams|link intime|mufg)\b', '\b(?:kfin|cams|link intime|mufg intime|bigshare)\b.{0,40}\b(?:ach|payout)\b']
  - id: rent
    category: bills.rent
    any: ['\brent (?:paid|received|payment)\b', '\bhouse rent\b', '\bhome rent\b', '\bmonthly rent\b', '\brent for (?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)']
  - id: gift
    category: gifts
    subject: ['\bgift transfer\b']
  - id: gift-counterparty
    category: gifts
    counterparty: ['\bgift transfer\b', 'gift\b(?! cards?\b)']
  - id: atm-cash
    category: cash
    any: ['\batm\b.{0,20}\b(?:withdrawal|wdl|cwd)\b', '\bcash withdrawal\b', '\bcash wdl\b', '\bnfs ?cash\b', '\bcash deposit\b', '\bcash dep\b', '\bwithdrawn at atm\b', '\bcash advance\b']
  - id: emi
    category: emi
    direction: DEBIT
    subject: ['\bemi\b', '\bloan (?:repayment|instal+ment|emi)\b']
  - id: emi-counterparty
    category: emi
    direction: DEBIT
    counterparty: ['\bemi\b', '\bloan\b', '\bbajaj fin(?:ance|serv)?\b', '\btata capital\b', '\bhdb financial\b', '\bhome credit\b', '\bmuthoot\b', '\bmanappuram\b', '\bfullerton\b', '\bpiramal\b', '\bpoonawalla\b', '\bmoneyview\b', '\bkreditbee\b', '\bcholamandalam\b', '\bshriram finance\b', '\bl ?(?:&|and)? ?t fin']
  - id: emi-nach
    category: emi
    direction: DEBIT
    any: ['\bnach\b.{0,60}\b(?:loan|lending|finance|finserv|capital|housing)\b', '\bloan (?:repayment|instal+ment)\b', '\bemi (?:of|debit|payment|deducted)\b']
  - id: bank-charges
