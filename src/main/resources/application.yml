spring:
  application:
    name: financeos-backend

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@financeos_high?TNS_ADMIN=${TNS_ADMIN}}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      data-source-properties:
        oracle.jdbc.timezoneAsRegion: "false"

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Must be 0. Flyway's default baseline-version is 1, which marks V1 as already
    # applied and skips it — so bootstrapping an empty schema dies on V2 (seed_user)
    # with ORA-00942, because V1 is what creates the users table.
    baseline-version: 0
    repair-on-migrate: true

  servlet:
    multipart:
      # No server-side upload size limit; without this Spring's defaults
      # (1MB/file, 10MB/request) reject real statement PDFs. The effective cap
      # (4.5MB, Vercel's request-body limit) is enforced by the client — kept
      # unlimited here so a future direct-to-API upload path isn't bound by it.
      max-file-size: -1
      max-request-size: -1

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 24h

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: ${SERVER_PORT:6969}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
        max-age: 86400
        name: FINANCEOS_SESSION

# Actuator: health only, no details — the endpoint is unauthenticated (see SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

# Application-specific configuration
app:
  version: "@project.version@-@gitSha@"
  encryption:
    key: ${ENCRYPTION_KEY:your-32-byte-base64-encoded-key-here==}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3001}
  ui-path: ${UI_PATH:http://localhost:3001}
  # Signup is invite-only. Unset/blank => all signups refused (fail closed).
  # Rotate by changing the env var and restarting; there is no expiry.
  invite:
    code: ${INVITE_CODE:}
    max-failures: ${INVITE_MAX_FAILURES:10}
    lockout-minutes: ${INVITE_LOCKOUT_MINUTES:15}

# Gmail OAuth configuration
gmail:
  oauth:
    client-id: ${GMAIL_CLIENT_ID:}
    client-secret: ${GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GMAIL_REDIRECT_URI:http://localhost:6969/api/v1/gmail/oauth/callback}
  ingest:
    enabled: ${GMAIL_INGEST_ENABLED:true}
    cron: ${GMAIL_INGEST_CRON:0 0 10-22/2 * * *}
    first-backfill-days: ${GMAIL_INGEST_BACKFILL_DAYS:30}
    zone: ${GMAIL_INGEST_ZONE:Asia/Kolkata}

# LLM Provider Layer configuration
llm:
  chain: ${LLM_CHAIN:openrouter,gemini}
  keys:
    master-key: ${LLM_KEYS_MASTER_KEY:}
  retry:
    attempts-per-provider: ${LLM_ATTEMPTS_PER_PROVIDER:2}
    base-delay-ms: 1000
    max-delay-ms: 8000
    cooldown-ms: 60000
  tasks:
    data-chat:
      chain: ${LLM_CHAT_CHAIN:gemini,openrouter}
  # The user-pickable routing menu. Settings shows ALL of these, always, in the user's order;
  # options whose provider has no key are simply skipped at runtime, so an unconfigured option
  # costs nothing but a place in the list.
  #
  # `models` = a chain: tried model-major (this model across every key, then the next model).
  # That is what makes one free-tier key usable — each model carries its own daily quota.
  routing-options:
    - id: gemini-chain
      label: "Gemini (full chain)"
      provider: gemini
      notes: "Every Gemini model in turn, newest first. Widest free-tier headroom."
    - id: gemini-flash-chain
      label: "Gemini (Flash chain)"
      provider: gemini
      models:
        - gemini-3.7-flash
        - gemini-3.6-flash
        - gemini-3.5-flash
        - gemini-3.5-flash-lite
        - gemini-3.1-flash-lite
      notes: "Current-generation Flash models only. Fastest first response — the best lead for Chat."
    - id: groq
      label: "Groq (GPT-OSS 120B)"
      provider: groq
      model: openai/gpt-oss-120b
    - id: openrouter-free
      label: "OpenRouter (free pool)"
      provider: openrouter
      model: openrouter/free
      notes: "Free routing pool. Rate-limited, and its training policy varies by upstream provider."
    - id: openrouter-glm
      label: "OpenRouter (GLM-5.3-Flash)"
      provider: openrouter
      model: z-ai/glm-5.3-flash
      notes: "Best quality per rupee. Slower to generate — better suited to background work than Chat."

  # Shipped order per task group, used until a user saves their own.
  # Chat leads with the Flash chain because ChatOrchestrator is wall-clock bound; background work
  # leads with the full chain and keeps the Flash chain in reserve at the end.
  default-routing:
    chat:
      - gemini-flash-chain
      - gemini-chain
      - groq
      - openrouter-free
      - openrouter-glm
    default:
      - gemini-chain
      - groq
      - openrouter-free
      - openrouter-glm
      - gemini-flash-chain

  providers:
    gemini:
      label: "Google Gemini"
      type: gemini
      # Authoritative order for the gemini-chain routing option. model-catalog below is
      # display metadata only (labels / free / trains-on-data) and never sets chain order.
      models: ${GEMINI_MODELS:gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
      batch-size: ${GEMINI_BATCH_SIZE:200}
      model-catalog:
        - id: gemini-3.7-flash
          label: "Gemini 3.7 Flash"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
          notes: "Fastest flagship reasoning model"
        - id: gemini-3.6-flash
          label: "Gemini 3.6 Flash"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
        - id: gemini-3.5-flash
          label: "Gemini 3.5 Flash"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
        - id: gemini-3.5-flash-lite
          label: "Gemini 3.5 Flash Lite"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
        - id: gemini-3.1-flash-lite
          label: "Gemini 3.1 Flash Lite"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
        - id: gemini-2.5-flash
          label: "Gemini 2.5 Flash"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
        - id: gemini-2.5-flash-lite
          label: "Gemini 2.5 Flash Lite"
          free: true
          trains-on-data: "yes"
          structured-output: json-schema
    groq:
      label: "Groq"
      type: openai
      base-url: https://api.groq.com/openai/v1
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      timeout-ms: 30000
      batch-size: ${GROQ_BATCH_SIZE:100}
      model-catalog:
        - id: openai/gpt-oss-120b
          label: "GPT-OSS 120B"
          free: true
          trains-on-data: "no"
          structured-output: json-schema
          notes: "Fast LPU inference"
    openrouter:
      label: "OpenRouter"
      type: openai
      base-url: https://openrouter.ai/api/v1
      model: ${OPENROUTER_MODEL:z-ai/glm-5.3-flash}
      # Paid z-ai/glm-5.3-flash supports full json_schema; 3 of 4 tasks pass a schema
      structured-output: json-schema
      # 45s was too tight for 40-item categorize batch (~1800 out tok @ ~50 tok/s = 36s); 90s prevents sub-chunk retries
      timeout-ms: 90000
      batch-size: ${OPENROUTER_BATCH_SIZE:40}
      model-catalog:
        - id: z-ai/glm-5.3-flash
          label: "GLM-5.3-Flash"
          free: false
          trains-on-data: "no"
          structured-output: json-schema
          notes: "Cost-effective, high quality reasoning"
        - id: openrouter/free
          label: "OpenRouter Free"
          free: true
          trains-on-data: "unknown"
          structured-output: json-object
          notes: "Free routing pool; latency and training policies vary"
    # Self-hosted (future) — config only, no code change:
    # ampere:
    #   type: openai
    #   base-url: http://<ampere-ip>:11434/v1
    #   allow-no-key: true
    #   model: qwen3:8b

# Google SSO configuration
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:${GMAIL_CLIENT_ID:}}
    client-secret: ${GOOGLE_CLIENT_SECRET:${GMAIL_CLIENT_SECRET:}}
    # Points at the CLIENT's callback page, not this server. The client exchanges
    # the code via a server action and sets FINANCEOS_SESSION on its own origin;
    # pointing this back at the API sets the cookie on the wrong origin (see
    # AuthController#handleGoogleCallback). Must also be registered verbatim as an
    # Authorized redirect URI in the Google Cloud console.
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:https://localhost:6970/auth/google/callback}

# Price Feed configuration
price:
  enabled: ${PRICE_FEED_ENABLED:true}
  refresh-cron: ${PRICE_REFRESH_CRON:0 0 19 * * *}
  timezone: ${PRICE_TIMEZONE:Asia/Kolkata}
  providers:
    amfi:
      enabled: true
      base-url: ${AMFI_BASE_URL:https://www.amfiindia.com}
      timeout-ms: 30000
    yahoo:
      enabled: true
      base-url: ${YAHOO_BASE_URL:https://query2.finance.yahoo.com}
      timeout-ms: 30000
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36"

# Background Jobs configuration
jobs:
  worker:
    concurrency: ${JOBS_WORKER_CONCURRENCY:2}
    poll-delay-ms: ${JOBS_WORKER_POLL_DELAY_MS:2000}
    queue-capacity: ${JOBS_WORKER_QUEUE_CAPACITY:100}
    # How long a shutdown/deploy waits for running jobs to finish before killing them
    # (killed jobs are swept to FAILED/INTERRUPTED on next boot).
    shutdown-grace-seconds: ${JOBS_WORKER_SHUTDOWN_GRACE_SECONDS:60}
  retention:
    days: ${JOBS_RETENTION_DAYS:30}
    failed-artifact-days: ${JOBS_FAILED_ARTIFACT_DAYS:7}
    cron: ${JOBS_RETENTION_CRON:0 30 3 * * *}
    zone: ${JOBS_RETENTION_ZONE:Asia/Kolkata}

# Chat with Your Data configuration
chat:
  enabled: ${CHAT_ENABLED:true}
  datasource:
    username: ${CHAT_RO_USERNAME:}
    password: ${CHAT_RO_PASSWORD:}
  app-schema: ${DB_USERNAME:ADMIN}
  quota:
    messages-per-day: 30
    max-concurrent: 2
  loop:
    max-iterations: 6
    # 180s safe: computeHardDeadlineMs yields 270s and SSE emitter is 290s
    max-wall-clock-seconds: ${CHAT_MAX_WALL_CLOCK_SECONDS:180}
    sql-row-cap: 200
    sql-timeout-seconds: 5
    result-char-cap: 16000
  stream:
    emitter-timeout-seconds: ${CHAT_EMITTER_TIMEOUT_SECONDS:290}




