      Dear Customer, Your ICICI Bank Credit Card XX1234 has been used for a transaction of INR 899.00 on Sep 20, 2026 at 02:43:26.
      Info: SAMPLE PAY IN E COMMERCE. The Available Credit Limit on your card is INR 6,69,079.00 and Total Credit Limit is INR 6,70,000.00.
    expect: {amount: '899.00', currency: INR, direction: DEBIT, date: '2026-09-20', counterparty: SAMPLE PAY IN E COMMERCE, last4: '1234'}

  - template: icici.cc.standing-instruction.v1
    from: 'ICICI Bank <alerts@icici.bank.in>'
