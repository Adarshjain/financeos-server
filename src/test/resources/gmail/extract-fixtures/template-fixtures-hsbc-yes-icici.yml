    sent: '2024-11-24T05:00:00Z'
    body: >-
      Dear Customer, We have successfully processed your payment of INR 246.05 towards Sample Shop, with Standing Instruction AbCdEf1234,
      on 24/11/2024, through your ICICI Bank Credit Card 1234. Click here to manage your Standing Instructions.
    expect: {amount: '246.05', currency: INR, direction: DEBIT, date: '2024-11-24', counterparty: Sample Shop, last4: '1234'}

  - template: icici.cc.payment.v1
    from: 'ICICI Bank <credit_cards@icicibank.com>'
    subject: 'Payment received on your ICICI Bank Credit Card.'
    sent: '2026-10-02T06:00:00Z'
    body: >-
      Payment received on your ICICI Bank Credit Card. Dear Customer, Oct 02,2026 Greetings from ICICI Bank!
      We have received payment of INR 22.00 on your ICICI Bank Credit Card account 4000 XXXX XXXX 1234 on 02-Oct-2026.
    expect: {amount: '22.00', currency: INR, direction: CREDIT, date: '2026-10-02', counterparty: null, last4: '1234'}

  - template: icici.cc.payment.v2
    from: 'ICICI Bank <credit_cards@icicibank.com>'
    subject: 'Payment of INR 54321.10 received on your ICICI Bank Credit Card XX1234'
    sent: '2024-09-05T06:00:00Z'
    body: >-
      Dear Customer, Greetings from ICICI Bank! Payment of INR 54321.10 towards ICICI Bank Credit Card XX1234 has been received
      through UPI on September 05, 2024. Thank you.
    expect: {amount: '54321.10', currency: INR, direction: CREDIT, date: '2024-09-05', counterparty: null, last4: '1234'}
