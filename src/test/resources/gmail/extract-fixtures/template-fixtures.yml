# One made-up email per template: everything below is invented (names, amounts, cards).
# `sent` is the email's sent instant; `expect` lists the fields the template must produce.
fixtures:
  - template: axis.cc.spend.v2
    from: 'Axis Bank Alerts <alerts@axis.bank.in>'
    subject: 'INR 1,234.50 spent on credit card no. XX1234'
    sent: '2026-03-10T05:30:00Z'
    body: >-
      Dear Test User, Here's the summary of your Axis Bank Credit Card Transaction:
      Transaction Amount: INR 1,234.50 Merchant Name: SAMPLE STORE Axis Bank Credit Card No. XX1234
      Date & Time: 10-03-2026, 11:00:00 IST Available Limit*: INR 5000 Total Credit Limit*: INR 9000
    expect: {amount: '1234.50', currency: INR, direction: DEBIT, date: '2026-03-10', counterparty: SAMPLE STORE, last4: '1234'}

  - template: axis.cc.spend.v2
