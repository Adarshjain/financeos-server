components:
  schemas:
    AcceptSuggestionsRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
          x-required: true
      required:
      - items
    AcceptSuggestionsResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: "#/components/schemas/DividendResponse"
        skippedCount:
          type: integer
          format: int32
      required:
      - created
      - skippedCount
    AccountResponse:
      discriminator:
        mapping:
          bank_account: "#/components/schemas/BankAccountResponse"
          broker: "#/components/schemas/BrokerAccountResponse"
          credit_card: "#/components/schemas/CreditCardAccountResponse"
          generic: "#/components/schemas/GenericAccountResponse"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/BankAccountResponse"
      - $ref: "#/components/schemas/CreditCardAccountResponse"
      - $ref: "#/components/schemas/BrokerAccountResponse"
      - $ref: "#/components/schemas/GenericAccountResponse"
    ApplyRuleRequest:
      type: object
      properties:
        all:
          type: boolean
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
    BankAccountRequest:
      type: object
      properties:
        description:
          type: string
        excludeFromNetAsset:
          type: boolean
        financialPosition:
          type: string
          enum:
          - asset
          - liability
        ingestFromDate:
          type: string
          format: date
        last4:
          type: string
        name:
          type: string
          x-required: true
        openingBalance:
          type: number
        statementPassword:
          type: string
        type:
          type: string
          enum:
          - bank_account
          x-required: true
      required:
      - name
      - type
    BankAccountResponse:
      type: object
      properties:
        anchorDate:
          type: string
          format: date
          nullable: true
          x-nullable: true
        balance:
          type: number
        balanceAnchored:
          type: boolean
        cardholders:
          type: array
          items:
            $ref: "#/components/schemas/CardholderResponse"
        closedOn:
          type: string
          format: date
          nullable: true
          x-nullable: true
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          x-nullable: true
        excludeFromNetAsset:
          type: boolean
        financialPosition:
          type: string
          enum:
          - asset
          - liability
          nullable: true
          x-nullable: true
        id:
          type: string
          format: uuid
        ingestFromDate:
          type: string
          format: date
          nullable: true
          x-nullable: true
        last4:
          type: string
          nullable: true
          x-nullable: true
        lastStatementDate:
          type: string
          format: date
          nullable: true
          x-nullable: true
        name:
          type: string
        openingBalance:
          type: number
          nullable: true
          x-nullable: true
        reconciliationGap:
          type: number
          nullable: true
          x-nullable: true
        replacesAccountId:
          type: string
          format: uuid
          nullable: true
          x-nullable: true
        type:
          type: string
          enum:
          - bank_account
        updatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
      required:
      - balance
      - balanceAnchored
      - cardholders
      - createdAt
      - excludeFromNetAsset
      - id
      - name
      - type
      - updatedAt
      - warnings
    BatchDeleteRequest:
      type: object
      properties:
        transactionIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 500
          minItems: 0
          x-required: true
      required:
      - transactionIds
    BatchDeleteResponse:
      type: object
      properties:
        failures:
          type: array
          items:
            $ref: "#/components/schemas/BatchFailure"
        succeededIds:
          type: array
          items:
            type: string
      required:
      - failures
      - succeededIds
    BatchFailure:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
      required:
      - id
      - reason
    BatchLoanPaymentItem:
      type: object
      properties:
        amount:
          type: number
          x-required: true
        installmentSeq:
          type: integer
          format: int32
          nullable: true
          x-nullable: true
        paymentDate:
          type: string
          format: date
          x-required: true
        transactionId:
          type: string
          format: uuid
          nullable: true
          x-nullable: true
      required:
      - amount
      - paymentDate
    BatchLoanPaymentRequest:
      type: object
      properties:
        items:
          type: array
          items:
