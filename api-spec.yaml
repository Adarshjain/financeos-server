    SimulatedRuleLineResponse:
      type: object
      required: [earned, earnedUnit, earnedValueInr, reason]
      properties:
        ruleId: { type: string, format: uuid, nullable: true }
        ruleName: { type: string, nullable: true }
        stacking: { type: string, nullable: true }
        earned: { type: number, format: float }
        earnedUnit: { type: string }
        earnedValueInr: { type: number, format: float }
        reason: { type: string }
        capStatus: { $ref: '#/components/schemas/SimulatedCapStatusResponse' }

    SimulatedMilestoneResponse:
      type: object
      required: [milestoneId, name, windowEnd, progress, threshold, remainingToThreshold, crosses, scoredValueInr, payoutType]
      properties:
        milestoneId: { type: string, format: uuid }
        name: { type: string }
        windowEnd: { type: string, format: date }
        progress: { type: number, format: float }
        threshold: { type: number, format: float }
        remainingToThreshold: { type: number, format: float }
        crosses: { type: boolean }
        payoutInr: { type: number, format: float, nullable: true }
        scoredValueInr: { type: number, format: float }
        payoutType: { type: string }

    RewardCardRecommendationResponse:
      type: object
      required: [accountId, accountName, rank, totalValueInr, guaranteedValueInr, milestoneValueInr, effectiveRatePct, pointValueSource, pointValueInr, pointsValued, ruleLines, milestones, noRulesConfigured, cycleFallback, anniversaryFallback]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        rank: { type: integer }
        totalValueInr: { type: number, format: float }
        guaranteedValueInr: { type: number, format: float }
        milestoneValueInr: { type: number, format: float }
        effectiveRatePct: { type: number, format: float }
        pointValueSource: { type: string, enum: [CONFIG, DEFAULT] }
        pointValueInr: { type: number, format: float }
        pointsValued: { type: boolean }
        ruleLines: { type: array, items: { $ref: '#/components/schemas/SimulatedRuleLineResponse' } }
        milestones: { type: array, items: { $ref: '#/components/schemas/SimulatedMilestoneResponse' } }
        noRulesConfigured: { type: boolean }
        cycleFallback: { type: boolean }
        anniversaryFallback: { type: boolean }

    RewardRecommendationResponse:
      type: object
      required: [input, recommendations]
      properties:
        input: { $ref: '#/components/schemas/RewardRecommendationRequest' }
        recommendations: { type: array, items: { $ref: '#/components/schemas/RewardCardRecommendationResponse' } }



