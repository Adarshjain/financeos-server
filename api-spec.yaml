openapi: 3.0.3
info:
  title: FinanceOS API
  description: Production-grade personal finance backend API
  version: 1.0.0
  contact:
    name: FinanceOS
servers:
  - url: http://localhost:6969
    description: Local development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Accounts
    description: Financial account management
  - name: Transactions
    description: Transaction tracking
  - name: Investments
    description: Investment transaction and position tracking
  - name: Gmail
    description: Gmail OAuth and email fetch engine
  - name: Rules
    description: Categorization rules
  - name: Dashboard
    description: Dashboard summary (skeleton)
  - name: Categories
    description: Transaction category management
  - name: Reports
    description: Dynamic user-defined reports over the transactions data source
  - name: Ingestion
    description: File upload ingestion for bulk transaction import
  - name: Loans
    description: Formal loan tracking, schedule engine, prepayments, and charges
  - name: Lendings
    description: Informal person-to-person money lent and borrowed
  - name: Counterparties
    description: Persons and organizations for P2P lendings
  - name: Obligations
    description: Upcoming loan EMIs and lending expected return calendar
  - name: Rewards
    description: Credit card reward engine, rule management, milestones, and recommendations

paths:

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User with email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Session cookie (HTTP-only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate session
      operationId: logout
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful

  /api/v1/auth/google/start:
    get:
      tags: [Auth]
      summary: Start Google SSO flow
      description: Returns Google OAuth authorization URL for Single Sign-On + Gmail access
      operationId: startGoogleAuth
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthStartResponse'

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google SSO callback
      description: Handles OAuth callback, creates user (if needed), links Gmail, and logs in
      operationId: handleGoogleCallback
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Auth failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: getCurrentUser
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated

  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create a new account
      operationId: createAccount
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Accounts]
      summary: List all accounts
      operationId: listAccounts
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'

  /api/v1/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account by ID
      operationId: getAccountById
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{id}/bank-details:
    post:
      tags: [Accounts]
      summary: Add or update bank details
      operationId: addBankDetails
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDetailsRequest'
      responses:
        '200':
          description: Bank details added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{id}/credit-card-details:
    post:
      tags: [Accounts]
      summary: Add or update credit card details
      operationId: addCreditCardDetails
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardDetailsRequest'
      responses:
        '200':
          description: Credit card details added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{id}/stock-details:
    post:
      tags: [Accounts]
      summary: Add or update stock details
      operationId: addStockDetails
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockDetailsRequest'
      responses:
        '200':
          description: Stock details added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{id}/mutual-fund-details:
    post:
      tags: [Accounts]
      summary: Add or update mutual fund details
      operationId: addMutualFundDetails
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutualFundDetailsRequest'
      responses:
        '200':
          description: Mutual fund details added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/accounts/{accountId}/ingest:
    post:
      tags: [Ingestion]
      summary: Ingest transactions from uploaded statement files
      description: >
        Accepts one or more PDF or Excel files containing financial statements
        for a specific account. Files are parsed using Gemini AI to extract
        transactions. Password-protected files are decrypted using the account's
        configured statement password. Duplicate transactions (same date, amount,
        type, and description) are flagged as NEEDS_REVIEW on both the existing
        and newly uploaded entries.
      operationId: ingestFiles
      security:
        - sessionAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          description: UUID of the account to ingest transactions into
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: One or more PDF (.pdf) or Excel (.xlsx, .xls) statement files
      responses:
        '200':
          description: Ingestion completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileIngestionResult'
        '400':
          description: Validation error (unsupported file type, empty file, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account does not belong to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions:
    post:
      tags: [Transactions]
      summary: Create a new transaction
      operationId: createTransaction
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Transactions]
      summary: List transactions (paginated)
      operationId: listTransactions
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
        - name: sort
          in: query
          schema:
            type: string
            default: date,desc
      responses:
        '200':
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransactionResponse'

  /api/v1/transactions/search:
    post:
      tags: [Transactions]
      summary: Search and filter transactions (paginated)
      description: |
        Search and filter transactions with custom filters.
        Supports virtual filter field `coveredByStatement` (boolean, operator `is`, values `true`/`false`).
      operationId: searchTransactions
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
        - name: sort
          in: query
          schema:
            type: string
            default: date,desc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSearchRequest'
      responses:
        '200':
          description: Paginated list of filtered transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTransactionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/batch-review:
    post:
      tags: [Transactions]
      summary: Batch update the review type of transactions
      operationId: batchReviewTransactions
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchReviewRequest'
      responses:
        '200':
          description: Batch update successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchReviewResponse'
        '400':
          description: Validation error or unauthorized/missing transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/batch-delete:
    post:
      tags: [Transactions]
      summary: Batch delete transactions
      operationId: batchDeleteTransactions
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
      responses:
        '200':
          description: Batch delete successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeleteResponse'
        '400':
          description: Validation error or unauthorized/missing transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/transactions/{id}:
    put:
      tags: [Transactions]
      summary: Update an existing transaction
      operationId: updateTransaction
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          description: Validation error
        '403':
          description: Forbidden (not transaction owner)
        '404':
          description: Transaction not found

    delete:
      tags: [Transactions]
      summary: Delete a transaction
      operationId: deleteTransaction
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Transaction deleted
        '403':
          description: Forbidden (not transaction owner)
        '404':
          description: Transaction not found

  /api/v1/investments/transactions:
    post:
      tags: [Investments]
      summary: Create investment transaction (buy/sell)
      operationId: createInvestmentTransaction
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvestmentTransactionRequest'
      responses:
        '201':
          description: Investment transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentTransactionResponse'
        '400':
          description: Validation error (e.g., selling more than holdings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Investments]
      summary: List investment transactions (paginated)
      operationId: listInvestmentTransactions
      security:
        - sessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated list of investment transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedInvestmentTransactionResponse'

  /api/v1/investments/position:
    get:
      tags: [Investments]
      summary: Get current investment positions (FIFO calculated)
      operationId: getInvestmentPositions
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Investment positions with FIFO-calculated cost basis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentPositionResponse'

  /api/v1/gmail/oauth/start:
    get:
      tags: [Gmail]
      summary: Start Gmail OAuth flow
      description: Returns Google OAuth authorization URL to connect user's Gmail account
      operationId: startGmailOAuth
      security:
        - sessionAuth: []
      responses:
        '200':
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailOAuthStartResponse'

  /api/v1/gmail/oauth/callback:
    get:
      tags: [Gmail]
      summary: Gmail OAuth callback
      description: Handles OAuth callback, exchanges code for tokens, stores encrypted refresh token
      operationId: gmailOAuthCallback
      security:
        - sessionAuth: []
      parameters:
        - name: code
          in: query
          description: Authorization code from Google
          schema:
            type: string
        - name: error
          in: query
          description: Error code if authorization failed
          schema:
            type: string
        - name: state
          in: query
          description: State parameter for verification
          schema:
            type: string
      responses:
        '302':
          description: |
            Redirects the browser to `${app.ui-path}/settings/gmail` with
            `?gmail=success&email=<address>` on success, or
            `?gmail=error&message=<reason>` on failure / missing code.
          headers:
            Location:
              description: SPA URL with gmail status query params
              schema:
                type: string

  /api/v1/gmail/sync:
    post:
      tags: [Gmail]
      summary: Run Gmail ingestion for the current user
      description: |
        Manually triggers an ingestion run for the user's connected Gmail account(s):
        fetches new emails from allowlisted senders (`from:(...) after:<lastSync>`),
        extracts transactions via Gemini (alerts) and reconciles statements, then persists
        transactions. The same pipeline also runs automatically on a cron schedule.
      operationId: syncGmail
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Ingestion run summary (counts of processed messages)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSummary'
        '400':
          description: Gmail not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Gmail authentication failed (token expired/revoked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/gmail/senders:
    get:
      tags: [Gmail]
      summary: List Gmail sender allowlist
      description: Senders whose emails are ingested (exact email address or domain)
      operationId: listGmailSenders
      security:
        - sessionAuth: []
      responses:
        '200':
          description: List of configured senders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GmailSenderResponse'
    post:
      tags: [Gmail]
      summary: Add a Gmail sender to the allowlist
      operationId: createGmailSender
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GmailSenderRequest'
      responses:
        '200':
          description: Created sender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailSenderResponse'

  /api/v1/gmail/senders/{id}:
    put:
      tags: [Gmail]
      summary: Update a Gmail sender
      operationId: updateGmailSender
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GmailSenderRequest'
      responses:
        '200':
          description: Updated sender
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GmailSenderResponse'
    delete:
      tags: [Gmail]
      summary: Delete a Gmail sender
      operationId: deleteGmailSender
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Sender deleted

  /api/v1/gmail/connections:
    get:
      tags: [Gmail]
      summary: List connected Gmail accounts
      operationId: listGmailConnections
      security:
        - sessionAuth: []
      responses:
        '200':
          description: The current user's Gmail connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GmailConnectionResponse'

  /api/v1/gmail/connections/{id}:
    delete:
      tags: [Gmail]
      summary: Disconnect a Gmail account
      description: Marks the connection disconnected and clears its sync state
      operationId: disconnectGmailConnection
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Connection disconnected
        '400':
          description: Not the owner / invalid connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rules:
    get:
      tags: [Rules]
      summary: List categorization rules (paginated)
      operationId: listRules
      security:
        - sessionAuth: []
      parameters:
        - name: verified
          in: query
          schema:
            type: boolean
          description: Filter by verification status
        - name: search
          in: query
          schema:
            type: string
          description: Search merchant key or display name
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            default: verified,asc;lastAppliedAt,desc
      responses:
        '200':
          description: Paginated list of rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRuleResponse'

    post:
      tags: [Rules]
      summary: Create a categorization rule
      operationId: createRule
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Merchant key already exists for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/rules/{id}:
    put:
      tags: [Rules]
      summary: Update a categorization rule
      operationId: updateRule
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Merchant key already exists for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Rules]
      summary: Delete a categorization rule
      operationId: deleteRule
      security:
