          format: date
          nullable: true
          x-nullable: true
        createdAt:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
          x-nullable: true
        excludeFromNetAsset:
          type: boolean
        financialPosition:
          type: string
          enum:
